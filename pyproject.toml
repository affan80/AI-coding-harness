[project]
name = "ai-coding-harness"
version = "0.1.0"
description = "Autonomous AI software engineering harness: repository + objective in, evidence-backed result out."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
harness = "tui.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit discovery: the flat layout holds several top-level packages
# (harness, tui, demos, scripts) plus tests/, which setuptools refuses to
# guess. Without this, `pip install -e '.[dev]'` (RELEASE_NOTES.md) fails.
[tool.setuptools.packages.find]
include = ["harness*", "tui*", "demos*", "scripts*"]
