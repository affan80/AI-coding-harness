[project]
name = "pentester-ai-harness"
version = "0.1.0"
description = "Autonomous AI software engineering harness"
requires-python = ">=3.11"

[project.scripts]
harness = "tui.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
